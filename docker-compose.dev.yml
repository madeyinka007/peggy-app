version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: peggy
      POSTGRES_PASSWORD: peggy
      POSTGRES_DB: peggy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peggy -d peggy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
